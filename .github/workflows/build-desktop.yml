name: 🏗️ Desktop Build

on:
    workflow_dispatch:
    push:
        branches:
            - main
        tags:
            - "v*"
    pull_request:
        branches:
            - main

permissions:
    contents: read

concurrency:
    group: desktop-build-${{ github.ref }}
    cancel-in-progress: true

jobs:
    build:
        name: 🏗️ ${{ matrix.name }}
        runs-on: ${{ matrix.platform }}
        strategy:
            fail-fast: false
            matrix:
                include:
                    - name: macOS (universal)
                      platform: macos-latest
                      args: --target universal-apple-darwin
                      bundles: app,dmg
                      artifact: ghostty-config-macos-universal
                    - name: Linux (x86_64)
                      platform: ubuntu-22.04
                      args: ""
                      bundles: deb,appimage
                      artifact: ghostty-config-linux-x86_64
                    - name: Windows (x86_64)
                      platform: windows-latest
                      args: ""
                      bundles: nsis,msi
                      artifact: ghostty-config-windows-x86_64
        steps:
            - name: 🚚 Checkout
              uses: actions/checkout@v4

            - name: Setup Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: 1.3.13

            - name: Setup Rust (macOS universal targets)
              if: matrix.platform == 'macos-latest'
              uses: dtolnay/rust-toolchain@stable
              with:
                  targets: aarch64-apple-darwin,x86_64-apple-darwin

            - name: Setup Rust
              if: matrix.platform != 'macos-latest'
              uses: dtolnay/rust-toolchain@stable

            - name: Cache Rust build
              uses: Swatinem/rust-cache@v2
              with:
                  workspaces: src-tauri -> target

            - name: Install Linux dependencies
              if: matrix.platform == 'ubuntu-22.04'
              run: |
                  sudo apt-get update
                  sudo apt-get install -y \
                    libwebkit2gtk-4.1-dev \
                    build-essential \
                    curl \
                    wget \
                    file \
                    libxdo-dev \
                    libssl-dev \
                    libayatana-appindicator3-dev \
                    librsvg2-dev \
                    patchelf

            - name: 📦 Install frontend dependencies
              run: bun install --frozen-lockfile

            - name: 🔨 Build desktop bundle
              run: bunx tauri build ${{ matrix.args }} --bundles ${{ matrix.bundles }}

            - name: 📤 Upload bundle
              uses: actions/upload-artifact@v4
              with:
                  name: ${{ matrix.artifact }}
                  path: src-tauri/target/**/release/bundle/**
                  if-no-files-found: error
                  retention-days: 14
